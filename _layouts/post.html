---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">← all posts</a></p>
</article>
