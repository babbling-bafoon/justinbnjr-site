<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">posts</a>
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="{{ '/feed.xml' | relative_url }}">rss</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>{{ site.title }} · N0JBE · <a href="{{ '/about/' | relative_url }}">about</a> · <a href="{{ '/feed.xml' | relative_url }}">rss</a></p>
    </footer>
  </div>
</body>
</html>
